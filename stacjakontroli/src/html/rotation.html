    Kwaternion rotacji:
    w=<input id="w" type="number" step="0.01" value="1" class="form-control form-control-sm" placeholder="w" style="width: 60px;">
    x=<input id="x" type="number" step="0.01" value="0" class="form-control form-control-sm" placeholder="x" style="width: 60px;">
    y=<input id="y" type="number" step="0.01" value="0" class="form-control form-control-sm" placeholder="y" style="width: 60px;">
